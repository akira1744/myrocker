services:
  rstudio:
    build:
      context: ./docker/
      dockerfile: Dockerfile
    image: nujabec/myrocker:20260519
    env_file: ./docker/.env
    ports:
      - "50003:8787"   # RStudio Server
      - "81:3838"      # Shiny Server
    volumes:
      - ../srv/:/home/rstudio/srv/
      - ../srv/shinyapps:/srv/shiny-server/
      - ../srv/shinylog:/var/log/shiny-server/
      - duckdb-data:/var/lib/duckdb
    environment:
      PASSWORD: rs
      ROOT: "TRUE"
      TZ: Asia/Tokyo
    tty: true
    stdin_open: true
    restart: always

volumes:
  duckdb-data:
