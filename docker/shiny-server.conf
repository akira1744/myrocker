# Shiny Server 設定 (image baked, /etc/shiny-server/shiny-server.conf)
#
# 高速化方針:
#  - app_idle_timeout 7200 (2h): 一度温めたら 2 時間 warm のまま保持
#  - app_init_timeout 120: 大きい global.R + parquet 読込でも余裕を持たせる
#  - simple_scheduler 100: 単一の R worker が最大 100 同時セッションを共有
#    (Shiny Server OSS の simple_scheduler N は「worker あたり N セッション」の意。
#     N=1 にすると 2 接続目以降が 503 で弾かれるため、十分大きい値にする)
#
# server レベルで設定し、location 配下の全 app に継承させる
# (アプリは最終的に /srv/shiny-server/<name>/ に置かれる前提)

run_as shiny;

server {
  listen 3838;

  app_idle_timeout 7200;
  app_init_timeout 120;
  simple_scheduler 100;

  # オフライン環境向けに image 内に焼き込んだ Noto Sans JP woff2 を配信
  # (Dockerfile で /opt/fonts-web/ に DL 済)
  # ブラウザは http://<host>:<port>/_fonts/noto-sans-jp/regular.woff2 で取得
  location /_fonts/ {
    site_dir /opt/fonts-web;
    log_dir  /var/log/shiny-server;
    directory_index off;
  }

  location / {
    site_dir /srv/shiny-server;
    log_dir  /var/log/shiny-server;
    directory_index on;
  }
}

preserve_logs true;
sanitize_errors false;
